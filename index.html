<<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Optimump2p PFP Generator</title>

  <!-- Main Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- Header -->
  <header>
    <img src="assets/optimump2p-logo.png" class="logo" alt="Optimump2p Logo" />
    <h1>Optimump2p PFP Generator</h1>
  </header>

  <!-- Main Container -->
  <main class="container">

    <!-- Upload Section -->
    <section class="upload-section">
      <h2>Upload your PFP</h2>

      <!-- Styled upload button -->
      <label class="action-btn upload-label">
        Upload Image
        <input type="file" id="pfpUpload" accept="image/*">
      </label>
    </section>

    <!-- Sticker Picker -->
    <section id="sticker-container">
      <div id="stickerPicker"></div>
    </section>

    <!-- Canvas -->
    <div class="canvas-wrapper">
      <canvas id="pfpCanvas"></canvas>
    </div>

   <div class="controls">
  <button id="flip" class="action-btn">Flip</button>
  <button id="delete" class="action-btn">Delete Sticker</button>
  <button id="download" class="action-btn">Download PFP</button>
</div>



  </main>

  <!-- Script -->
  <script src="script.js"></script>
</body>
</html>
